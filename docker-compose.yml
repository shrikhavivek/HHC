services:
  storage-init:
    build: ./apps/api
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data/outputs", "/data/media"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - output_data:/data/outputs
      - media_data:/data/media
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outfit_research}
      POSTGRES_USER: ${POSTGRES_USER:-outfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outfit} -d ${POSTGRES_DB:-outfit_research}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./apps/api
    environment: &api_environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://outfit:change-me@db:5432/outfit_research}
      EDITOR_API_KEY: ${EDITOR_API_KEY:-local-editor-key}
      CORS_ORIGINS: http://localhost:3100
      OUTPUT_DIR: /data/outputs
      MEDIA_DIR: /data/media
      AUTO_APPROVE: "false"
      WORDPRESS_PUBLISHER_ENABLED: ${WORDPRESS_PUBLISHER_ENABLED:-false}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:-https://www.highheelconfidential.com}
      REDDIT_SOURCE_MODE: ${REDDIT_SOURCE_MODE:-rss}
      SCHEDULER_IN_API: "false"
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-}
      INSTAGRAM_WATCH_ACCOUNTS: ${INSTAGRAM_WATCH_ACCOUNTS:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      REDDIT_SUBREDDIT: BollywoodFashion
      REDDIT_USER_AGENT: "${REDDIT_USER_AGENT:-hhc-daily-drafts/2.0 (contact: admin@highheelconfidential.com)}"
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_DAILY_TIMEZONE: ${REDDIT_DAILY_TIMEZONE:-Asia/Kolkata}
      REDDIT_LISTING_PAGE_SIZE: ${REDDIT_LISTING_PAGE_SIZE:-100}
      REDDIT_LISTING_MAX_PAGES: ${REDDIT_LISTING_MAX_PAGES:-50}
      REDDIT_MATCH_SEARCH_LIMIT: ${REDDIT_MATCH_SEARCH_LIMIT:-100}
      SOURCE_IMPORT_USER_AGENT: "${SOURCE_IMPORT_USER_AGENT:-Mozilla/5.0 (compatible; HHCEditorialImporter/1.0; +https://www.highheelconfidential.com)}"
      PUBLIC_IMPORT_ALLOWED_DOMAINS: ${PUBLIC_IMPORT_ALLOWED_DOMAINS:-instagram.com,threads.net,facebook.com,fb.watch,x.com,twitter.com,t.co,pinterest.com,pin.it,tiktok.com,youtube.com,youtu.be,reddit.com}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      WEB_DISCOVERY_FEEDS: ${WEB_DISCOVERY_FEEDS:-https://www.highheelconfidential.com/feed/,https://www.bollywoodhungama.com/bollywood/fashion/feed/}
      DESIGNER_REFERENCE_SEARCH_ENABLED: "true"
      DAILY_AUTOMATION_ENABLED: ${DAILY_AUTOMATION_ENABLED:-true}
      DAILY_GALLERY_RETRY_BUDGET: ${DAILY_GALLERY_RETRY_BUDGET:-8}
      DAILY_REMOTE_SEARCH_BUDGET: ${DAILY_REMOTE_SEARCH_BUDGET:-8}
      REDDIT_OAUTH_DAILY_SEARCH_BUDGET: ${REDDIT_OAUTH_DAILY_SEARCH_BUDGET:-80}
      DAILY_DESIGNER_SEARCH_BUDGET: ${DAILY_DESIGNER_SEARCH_BUDGET:-8}
      DAILY_AUTOMATION_HOUR_UTC: ${DAILY_AUTOMATION_HOUR_UTC:-3}
      DAILY_AUTOMATION_MINUTE_UTC: ${DAILY_AUTOMATION_MINUTE_UTC:-30}
      COLLAGE_RENDER_ON_PULL: ${COLLAGE_RENDER_ON_PULL:-false}
      ARCHIVE_PURGE_ENABLED: ${ARCHIVE_PURGE_ENABLED:-false}
      ARCHIVE_PURGE_GRACE_DAYS: ${ARCHIVE_PURGE_GRACE_DAYS:-7}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-0}
    ports: ["127.0.0.1:8100:8000"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - output_data:/data/outputs
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3100}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      EDITOR_API_KEY: ${EDITOR_API_KEY:-local-editor-key}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:-https://www.highheelconfidential.com}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EDITOR_USERNAME: ${EDITOR_USERNAME:-}
      EDITOR_PASSWORD_HASH: ${EDITOR_PASSWORD_HASH:-}
    ports: ["127.0.0.1:3100:3000"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment: *api_environment
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - output_data:/data/outputs
      - media_data:/data/media
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  output_data:
  media_data:
